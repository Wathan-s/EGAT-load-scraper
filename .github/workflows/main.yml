name: EGAT & Weather Data Scraper (CSV)

on:
  schedule:
    # รันทุกๆ 1 ชั่วโมง (นาทีที่ 0 ของทุกชั่วโมง)
    - cron: '0 * * * *'
  workflow_dispatch:

# เปิดสิทธิ์ให้ Action สามารถ Commit ไฟล์กลับเข้า Repo ได้
permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install Thai Fonts
      run: sudo apt-get update && sudo apt-get install -y fonts-thai-tlwg
   
    - name: Install All Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium webdriver-manager requests

    - name: Execute Python Scraper Script
      env:
        OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      run: python egat_logger.py

    - name: Commit and Push Data back to Repository
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add evidence/
        git commit -m "Auto-log EGAT data: $(date)" || echo "No changes to commit"
        git pull --rebase origin main
        git push
